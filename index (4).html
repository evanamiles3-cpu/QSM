<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#116EEF;--blue2:#428BF2;--blue-dark:#1454ad;--ink:#172235;--muted:#718096;--line:#E4EAF2;--soft:#F3F7FD;--green:#20B981;--red:#E45D67;--radius:22px;--shadow:0 18px 55px rgba(35,75,130,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#e3efff 0,transparent 28%),#f4f7fc;color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}.app{width:min(100% - 48px,1120px);min-height:min(860px,calc(100vh - 64px));margin:32px auto;background:#fff;position:relative;overflow:hidden;border:1px solid #e5ebf3;border-radius:30px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.topbar{padding:28px 54px 16px;display:flex;align-items:center;gap:18px}.back{border:0;background:#f0f5fd;color:#38516f;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;transition:.2s}.back:hover{background:#e4efff;transform:translateX(-2px)}.progress-wrap{flex:1}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:8px}.track{height:8px;background:#e9eef5;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#54a1ff);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
main{padding:22px 54px 130px;flex:1;max-width:980px;width:100%;margin:0 auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--blue);font-weight:900;text-align:center;margin:8px 0 7px}.heading{text-align:center;font-size:clamp(25px,3vw,34px);line-height:1.2;letter-spacing:-.7px;margin:0 0 20px;font-weight:900}.media-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#f4f7fc;margin:0 auto 26px;max-width:820px;box-shadow:0 7px 20px rgba(29,65,110,.05);animation:rise .45s both}.media-frame{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#d9eaff,#a8caff);overflow:hidden}.media-frame video,.media-frame img{width:100%;height:100%;object-fit:cover;display:block}.media-frame img{position:absolute;inset:0}.media-frame video{position:relative;z-index:1;background:#172235}.media-frame.no-video img{z-index:2}.media-frame.no-video video{display:none}.media-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#316bb8;font-weight:900;background:linear-gradient(135deg,#dcecff,#b8d6ff);text-align:center;padding:20px}.media-placeholder span{display:block;font-size:42px;margin-bottom:8px}.media-frame.has-image .media-placeholder{display:none}
.video-controls{position:absolute;z-index:4;bottom:12px;left:12px;right:12px;border-radius:999px;background:rgba(17,110,239,.96);color:white;display:flex;align-items:center;gap:10px;padding:9px 12px;box-shadow:0 7px 20px #116eef55;backdrop-filter:blur(10px)}.icon-btn{border:0;background:transparent;color:white;width:25px;height:25px;display:grid;place-items:center;padding:0}.time{font-size:11px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.scrub{min-width:0;flex:1;accent-color:white;height:4px}.speed{border:0;color:#fff;background:#ffffff20;border-radius:99px;padding:3px 7px;font-size:11px;font-weight:900}.caption{padding:11px 15px;text-align:center;color:#52647b;font-size:13px;font-weight:700}
.statement{font-size:18px;line-height:1.7;text-align:center;padding:0 5px;margin:0 auto 25px;max-width:760px;animation:fade .4s both}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px;margin:0 auto}.option{min-height:112px;border:1.5px solid var(--line);background:#fff;border-radius:17px;padding:14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:11px;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;animation:rise .4s both}.option:hover{border-color:#9bc3ff;transform:translateY(-2px);box-shadow:0 8px 18px #1769d20d}.option:active{transform:scale(.98)}.letter{width:27px;height:27px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:#718096;font-size:11px;font-weight:900}.option-text{font-size:15px;line-height:1.4;font-weight:800}.option.selected{border-color:var(--blue);background:#eff6ff;color:var(--blue)}.option.selected .letter{background:var(--blue);border-color:var(--blue);color:#fff}.option.correct{background:#eafaf4;border-color:var(--green);color:#08784e}.option.correct .letter{background:var(--green);border-color:var(--green);color:white}.option.wrong{background:#fff0f1;border-color:var(--red);color:#b13c47}.option.wrong .letter{background:var(--red);border-color:var(--red);color:white}.option:disabled{cursor:default}
.drawer{position:fixed;z-index:10;bottom:0;left:50%;transform:translate(-50%,110%);opacity:0;pointer-events:none;width:min(100%,1120px);padding:16px 24px calc(18px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -10px 35px #1e3a5c0d;backdrop-filter:blur(16px);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s}.drawer.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.feedback{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13px;font-weight:900}.feedback small{display:block;color:var(--muted);font-weight:600;margin-top:2px}.feedback-icon{width:30px;height:30px;border-radius:11px;background:#e9f9f2;color:#07945e;display:grid;place-items:center}.primary{width:100%;border:0;border-radius:15px;padding:15px 18px;background:var(--blue);color:#fff;font-weight:900;font-size:14px;box-shadow:0 8px 18px #116eef30;transition:.2s}.primary:hover{background:var(--blue-dark);transform:translateY(-1px)}.primary:active{transform:scale(.985)}.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.result{display:none;text-align:center;padding:55px 8px 20px;animation:rise .45s both}.result.show{display:block}.trophy{width:76px;height:76px;border-radius:25px;background:linear-gradient(135deg,#e4f0ff,#c8e0ff);display:grid;place-items:center;margin:0 auto 20px;font-size:34px}.result h2{font-size:27px;margin:0 0 7px}.result p{color:var(--muted);margin:0 0 22px}.score-ring{width:140px;height:140px;border-radius:50%;margin:20px auto;background:conic-gradient(var(--blue) var(--score,0%),#eaf0f7 0);display:grid;place-items:center;position:relative}.score-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:white}.score-value{position:relative;font-size:30px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0 25px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:13px 5px}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted);font-weight:800}.hidden{display:none!important}
.upload-row{display:flex;justify-content:center;gap:8px;margin:14px 0 0}.mini{border:1px solid var(--line);background:#fff;color:#62748c;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:800}.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-15px);opacity:0;z-index:30;background:#172235;color:white;padding:10px 15px;border-radius:12px;font-size:12px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}

.remote-pill{border:1px solid var(--line);background:#fff;color:#4a5f7c;border-radius:99px;padding:8px 13px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.2s}.remote-pill:hover{border-color:#9bc3ff}.remote-pill:before{content:"";width:8px;height:8px;border-radius:50%;background:#c3cddb}.remote-pill.on{color:#08784e;border-color:#bfe9d8;background:#f2fbf7}.remote-pill.on:before{background:var(--green)}.remote-pill.busy:before{background:#f2b33d}.remote-pill.err{color:#b13c47;border-color:#f3c9cd}.remote-pill.err:before{background:var(--red)}
.option.reading{border-color:#9bc3ff;background:#f3f8ff;box-shadow:0 0 0 3px #116eef1a}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:700px){
  .app{width:100%;min-height:100svh;margin:0;border:0;border-radius:0}
  .topbar{padding:20px 22px 12px}
  main{padding:14px 22px 145px}
  .drawer{width:100%}
}
@media(min-width:701px){
  .drawer{position:absolute;bottom:0;border-radius:0 0 30px 30px;padding-left:54px;padding-right:54px}
}
@media(max-width:360px){.topbar{padding:16px 17px 8px}main{padding:10px 17px 145px}.options{gap:9px}.option{padding:11px;min-height:91px}.statement{font-size:14px}.drawer{padding-left:17px;padding-right:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="Previous question" title="Previous question">←</button>
    <div class="progress-wrap">
      <div class="progress-meta"><span id="progressLabel">QUESTION 1 OF 4</span><span id="percentLabel">25%</span></div>
      <div class="track"><div class="fill" id="progressFill"></div></div>
    </div>
    <button class="remote-pill" id="remoteBtn" type="button" title="Connect the remote control (tap once so this page may read aloud)">Remote off</button>
  </div>
  <main>
    <div id="quizView">
      <p class="eyebrow" id="eyebrow">THE POWER OF HUMOUR</p>
      <h1 class="heading" id="questionTitle">Watch and choose the right punchline</h1>
      <section class="media-card">
        <div class="media-frame" id="mediaFrame">
          <div class="media-placeholder" id="mediaPlaceholder"><div><span>▶</span>Video preview</div></div>
          <video id="video" playsinline preload="metadata"></video>
          <div class="video-controls" id="videoControls">
            <button class="icon-btn" id="playBtn" aria-label="Play or pause">▶</button>
            <span class="time" id="timeText">0:00 / 0:00</span>
            <input class="scrub" id="scrub" type="range" min="0" max="100" value="0" aria-label="Video progress">
            <button class="speed" id="speedBtn">1×</button>
          </div>
        </div>
        <div class="caption" id="caption">The Power of Humour</div>
      </section>
      <p class="statement" id="statement"></p>
      <div class="options" id="options"></div>
    </div>
    <section class="result" id="result">
      <div class="trophy">🏆</div>
      <h2>Session complete!</h2>
      <p id="resultMessage">Great work. Here is your result.</p>
      <div class="score-ring" id="scoreRing"><div class="score-value" id="scorePercent">0%</div></div>
      <div class="stats">
        <div class="stat"><strong id="correctCount">0</strong><span>Correct</span></div>
        <div class="stat"><strong id="wrongCount">0</strong><span>Incorrect</span></div>
        <div class="stat"><strong id="totalCount">0</strong><span>Questions</span></div>
      </div>
      <button class="primary" id="restartBtn">Practice again</button>
    </section>
  </main>
  <div class="drawer" id="drawer">
    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="feedbackIcon">✓</span>
      <div><span id="feedbackTitle">Correct!</span><small id="feedbackNote"></small></div>
    </div>
    <button class="primary" id="actionBtn" disabled>Choose an answer</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   YOUR QUESTIONS — edit this block. No JSON file is needed.
   answer = number of the correct option, starting at 0 (A=0, B=1, C=2, D=3)
   video / image are optional direct links (.mp4 / .jpg); leave "" if unused
   ============================================================ */
const QUIZ={
  quiz:{title:"The Power of Humour",video:""},
  questions:[
    {
      title:"Watch and choose the right punchline",
      caption:"Scene 1",
      statement:"What is the funniest ending to this joke?",
      options:["Option one","Option two","Option three","Option four"],
      answer:1,
      explanation:"Because the second option is a surprise.",
      video:"",startTime:0,image:""
    },
    {
      title:"Question 2",
      caption:"Scene 2",
      statement:"Another question here",
      options:["Yes","No"],
      answer:0,
      explanation:"Short explanation.",
      video:"",startTime:0,image:""
    }
  ]
};

const LETTERS=["A","B","C","D","E","F"];
let data=null,items=[],index=0,selected=null,checked=false,score=0,answers=[],speedIndex=0;
const speeds=[1,1.25,1.5,2];
const $=id=>document.getElementById(id);
const video=$("video");
function toast(message,ms=2200){const el=$("toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),ms)}
function safeText(value){return String(value??"")}
async function init(){
  data=QUIZ;
  items=data.questions;
  $("eyebrow").textContent=data.quiz?.title||"INTERACTIVE QUIZ";
  render();
}
function render(){
  if(!items.length)return;
  stopSpeaking();
  selected=null;checked=false;
  const q=items[index];
  $("quizView").classList.remove("hidden");$("result").classList.remove("show");
  $("questionTitle").textContent=q.title||`Question ${index+1}`;
  $("caption").textContent=q.caption||"";
  $("statement").textContent=q.statement||"";
  $("progressLabel").textContent=`QUESTION ${index+1} OF ${items.length}`;
  const pct=Math.round(((index+1)/items.length)*100);
  $("percentLabel").textContent=pct+"%";$("progressFill").style.width=pct+"%";
  $("backBtn").disabled=index===0;
  $("drawer").classList.remove("show");
  const grid=$("options");grid.innerHTML="";
  (q.options||[]).forEach((option,i)=>{
    const b=document.createElement("button");b.className="option";b.type="button";
    const letter=document.createElement("span");letter.className="letter";letter.textContent=LETTERS[i]||i+1;
    const text=document.createElement("span");text.className="option-text";text.textContent=safeText(option);
    b.append(letter,text);b.style.animationDelay=(i*.055)+"s";b.addEventListener("click",()=>choose(i));grid.append(b);
  });
  $("actionBtn").disabled=true;$("actionBtn").textContent="Choose an answer";
  loadMedia(q);
  notifyRemote();
}
function loadMedia(q){
  video.pause();video.muted=true;video.removeAttribute("src");video.load();
  const src=q.video||data.quiz?.video||"";
  $("mediaPlaceholder").classList.remove("hidden");
  $("mediaFrame").classList.remove("has-image","no-video");
  if(src){video.src=src;video.onloadedmetadata=()=>{const t=Number(q.startTime)||0;if(t<video.duration)video.currentTime=t;$("mediaPlaceholder").classList.add("hidden")};video.onerror=()=>{$("mediaFrame").classList.add("no-video");$("mediaPlaceholder").classList.remove("hidden")}}
  else {$("mediaFrame").classList.add("no-video")}
  const image=q.image||"";
  if(image){
    const img=new Image();img.onload=()=>{let old=$("questionImage");if(old)old.remove();const node=document.createElement("img");node.id="questionImage";node.src=image;node.alt="Question illustration";node.style.zIndex="2";$("mediaFrame").append(node);$("mediaFrame").classList.add("has-image")};
    img.onerror=()=>{};img.src=image;
  }else{const old=$("questionImage");if(old)old.remove()}
  updateTime();
}
function choose(i){if(checked)return;selected=i;[...$("options").children].forEach((b,n)=>b.classList.toggle("selected",n===i));$("actionBtn").disabled=false;$("actionBtn").textContent="Check answer";$("drawer").classList.add("show");notifyRemote()}
function act(){
  const q=items[index];
  if(!checked){
    if(selected===null)return;
    checked=true;video.pause();
    const correct=selected===Number(q.answer);if(correct)score++;
    answers[index]={selected,correct};
    [...$("options").children].forEach((b,i)=>{b.disabled=true;b.classList.remove("selected");if(i===Number(q.answer))b.classList.add("correct");else if(i===selected&&!correct)b.classList.add("wrong")});
    $("feedbackIcon").textContent=correct?"✓":"×";$("feedbackIcon").style.background=correct?"#e9f9f2":"#fff0f1";$("feedbackIcon").style.color=correct?"#07945e":"#c83e4c";
    $("feedbackTitle").textContent=correct?"Correct!":`Correct answer: ${LETTERS[Number(q.answer)]||Number(q.answer)+1}`;
    $("feedbackNote").textContent=q.explanation||"";
    $("actionBtn").textContent=index===items.length-1?"See results":"Continue";
  }else if(index<items.length-1){index++;render()}else{finish()}
  notifyRemote();
}
function finish(){
  $("drawer").classList.remove("show");$("quizView").classList.add("hidden");$("result").classList.add("show");
  const pct=Math.round((score/items.length)*100);
  $("scorePercent").textContent=pct+"%";$("scoreRing").style.setProperty("--score",pct+"%");
  $("correctCount").textContent=score;$("wrongCount").textContent=items.length-score;$("totalCount").textContent=items.length;
  $("resultMessage").textContent=pct>=80?"Excellent work! You have a strong understanding.":pct>=50?"Good effort! Review the explanations and try again.":"Keep practising. Every attempt helps you improve.";
  $("progressFill").style.width="100%";$("percentLabel").textContent="100%";video.pause();
  notifyRemote();
}
function updateTime(){const f=n=>{if(!Number.isFinite(n))return"0:00";return Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0")};$("timeText").textContent=`${f(video.currentTime)} / ${f(video.duration)}`;$("scrub").value=video.duration?video.currentTime/video.duration*100:0}
video.muted=true;video.volume=0;video.addEventListener("timeupdate",updateTime);video.addEventListener("loadedmetadata",updateTime);
$("playBtn").onclick=()=>{if(!video.src){toast("Load a video first");return}if(video.paused)video.play().catch(()=>toast("Unable to play this video"));else video.pause()};
video.addEventListener("play",()=>$("playBtn").textContent="Ⅱ");video.addEventListener("pause",()=>$("playBtn").textContent="▶");
$("scrub").oninput=e=>{if(video.duration)video.currentTime=Number(e.target.value)/100*video.duration};
$("speedBtn").onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;video.playbackRate=speeds[speedIndex];$("speedBtn").textContent=speeds[speedIndex]+"×"};
$("actionBtn").onclick=act;
$("backBtn").onclick=()=>{if(index>0){index--;render()}};
$("restartBtn").onclick=()=>{index=0;score=0;answers=[];speedIndex=0;video.playbackRate=1;$("speedBtn").textContent="1×";render()};
/* ============================================================
   REMOTE CONTROL via Supabase (REST, no libraries)
   Table: remote_kv (key text primary key, value jsonb, updated_at timestamptz)
   ============================================================ */
const REMOTE={
  supabaseUrl:"https://hkcdppuizjivwqtoskgh.supabase.co",   // e.g. https://abcdxyz.supabase.co
  anonKey:"sb_publishable_6frxj_6SrF-PvJ9Mv2ilzw_vpk-tT1N",  // Project Settings > API: anon (legacy) or publishable key
  room:"main",                       // must be identical in remote.html
  pollMs:1000,                       // how often this page checks for commands
  heartbeatMs:30000,                 // how often it tells the remote it is still online
  speechLang:"en-GB"                 // language used to read questions aloud
};
(()=>{const p=new URLSearchParams(location.search);if(p.get("room"))REMOTE.room=p.get("room");if(p.get("lang"))REMOTE.speechLang=p.get("lang")})();

const remoteConfigured=()=>REMOTE.supabaseUrl.startsWith("http")&&REMOTE.anonKey&&!REMOTE.anonKey.startsWith("YOUR_");
const dbBase=()=>REMOTE.supabaseUrl.replace(/\/+$/,"")+"/rest/v1/remote_kv";
const dbHeaders=json=>{const h={apikey:REMOTE.anonKey,Accept:"application/json"};if(json)h["Content-Type"]="application/json";return h};
async function dbGet(key){
  const r=await fetch(dbBase()+"?select=value&key=eq."+encodeURIComponent(key),{headers:dbHeaders(),cache:"no-store"});
  if(!r.ok)throw new Error("Supabase read "+r.status+" "+(await r.text().catch(()=>"")).slice(0,140));
  const rows=await r.json();
  return Array.isArray(rows)&&rows.length?rows[0].value:null;
}
async function dbSet(key,obj){
  const h=dbHeaders(true);h.Prefer="resolution=merge-duplicates,return=minimal";
  const r=await fetch(dbBase()+"?on_conflict=key",{method:"POST",headers:h,body:JSON.stringify({key,value:obj,updated_at:new Date().toISOString()})});
  if(!r.ok)throw new Error("Supabase write "+r.status+" "+(await r.text().catch(()=>"")).slice(0,140));
}

let remoteOn=false,lastCmdId=null,pushTimer=null,pollTimer=null,hbTimer=null,fails=0,reading=false,readToken=0;
const KEY_CMD=()=>"command-"+REMOTE.room,KEY_STATE=()=>"state-"+REMOTE.room;
function setPill(text,cls){const b=$("remoteBtn");b.textContent=text;b.className="remote-pill"+(cls?" "+cls:"")}
setPill(remoteConfigured()?"Remote off":"Set up remote","");

async function enableRemote(){
  if(!remoteConfigured()){toast("Add your Supabase URL and key in the REMOTE block of index.html");return}
  // This tap unlocks text-to-speech so remote commands can start the reading later.
  if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("ready");u.volume=0;speechSynthesis.speak(u)}
  setPill("Connecting…","busy");
  try{
    const c=await dbGet(KEY_CMD());lastCmdId=c&&c.id?c.id:null;   // ignore old commands
    remoteOn=true;await pushState(true);   // test write: fails loudly if Supabase blocks writing
    fails=0;setPill("Remote on","on");
    schedulePoll();hbTimer=setInterval(pushState,REMOTE.heartbeatMs);
    toast("Remote connected");
  }catch(e){console.error(e);remoteOn=false;setPill("Remote error","err");toast(String(e.message||e),6000)}
}
function disableRemote(){remoteOn=false;clearTimeout(pollTimer);clearInterval(hbTimer);stopSpeaking();setPill("Remote off","")}
$("remoteBtn").onclick=()=>remoteOn?disableRemote():enableRemote();

function schedulePoll(ms){clearTimeout(pollTimer);if(remoteOn)pollTimer=setTimeout(pollCommand,ms??REMOTE.pollMs)}
async function pollCommand(){
  try{
    const c=await dbGet(KEY_CMD());fails=0;
    if(!remoteOn)return;
    setPill("Remote on","on");
    if(c&&c.id&&c.id!==lastCmdId){lastCmdId=c.id;runCommand(c)}
    schedulePoll();
  }catch(e){fails++;if(!remoteOn)return;setPill("Reconnecting…","busy");schedulePoll(Math.min(30000,REMOTE.pollMs*2**Math.min(fails,4)))}
}

const ACTIONS=["read","stop","choose","confirm","back","playpause","restart"];
function runCommand(c){
  if(!c||!ACTIONS.includes(c.action))return;
  const inResult=$("result").classList.contains("show");
  // Ignore answers aimed at a question this page is no longer showing
  if((c.action==="choose"||c.action==="confirm")&&Number.isInteger(c.q)&&c.q!==index&&!inResult){pushState();return}
  switch(c.action){
    case"read":if(!inResult)speakQuestion();break;
    case"stop":stopSpeaking();break;
    case"choose":{
      const i=Number(c.index),n=(items[index]?.options||[]).length;
      if(!inResult&&!checked&&Number.isInteger(i)&&i>=0&&i<n){stopSpeaking();choose(i)}
      break}
    case"confirm":if(!inResult&&!(selected===null&&!checked)){stopSpeaking();act()}break;
    case"back":stopSpeaking();$("backBtn").click();break;
    case"playpause":$("playBtn").click();break;
    case"restart":if(inResult)$("restartBtn").click();break;
  }
  queuePush();
}

function markReading(i){[...$("options").children].forEach((b,n)=>b.classList.toggle("reading",n===i))}
function stopSpeaking(){
  readToken++;reading=false;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  markReading(null);
}
function speakQuestion(){
  if(!("speechSynthesis" in window)){toast("This browser cannot read aloud");return}
  const q=items[index];if(!q)return;
  stopSpeaking();video.pause();
  const token=readToken,parts=[{t:q.title||""},{t:q.statement||""}];
  (q.options||[]).forEach((o,i)=>parts.push({t:"Option "+(LETTERS[i]||i+1)+". "+safeText(o),opt:i}));
  const list=parts.filter(p=>p.t);reading=true;queuePush();
  setTimeout(()=>{
    if(token!==readToken)return;
    list.forEach((p,n)=>{
      const u=new SpeechSynthesisUtterance(p.t);u.lang=REMOTE.speechLang;u.rate=.95;
      u.onstart=()=>{if(token===readToken)markReading(p.opt??null)};
      const done=()=>{if(token===readToken&&n===list.length-1){reading=false;markReading(null);queuePush()}};
      u.onend=done;u.onerror=done;
      speechSynthesis.speak(u);
    });
  },80);
}

function notifyRemote(){queuePush()}
function queuePush(){if(!remoteOn)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushState,500)}
async function pushState(strict){
  if(!remoteOn||!items.length)return;
  const q=items[index]||{},fin=$("result").classList.contains("show");
  const state={
    ts:Date.now(),q:index,total:items.length,done:fin,score,
    title:q.title||"",statement:q.statement||"",options:(q.options||[]).map(safeText),
    selected,checked,
    answer:checked?Number(q.answer):null,
    correct:checked&&answers[index]?answers[index].correct:null,
    explanation:checked?(q.explanation||""):"",
    reading,playing:!!video.src&&!video.paused
  };
  try{await dbSet(KEY_STATE(),state)}catch(e){console.error(e);if(strict)throw e;setPill("Write failed","err");toast(String(e.message||e),6000)}
}

init();
</script>
